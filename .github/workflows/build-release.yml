name: Build and Release Mod

on:
  push:
    branches:
      - '1.21.4'  # Runs a compile check whenever you push updates to this branch
    tags:
      - 'v*'      # Triggers the official GitHub Release asset creation when you push a version tag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create and upload assets to the Release page

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build All Mod Loaders
        run: ./gradlew clean build --stacktrace

      - name: Collect Release Artifacts
        run: |
          mkdir -p dist
          # Recursively finds built jars in loader subfolders, filtering out utility/source jars
          find . -type f -wholename "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-all.jar" | while read -r file; do
            cp "$file" dist/
          done
          echo "Collected files for release:"
          ls -l dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # Only runs this step if your push was a version tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}