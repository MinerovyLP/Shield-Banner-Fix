name: Build and Release Fabric Mod

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag matching v1.0, v2.1.4, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission allowing the runner to upload assets to releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod with Loom
        run: ./gradlew build

      - name: Verify Built Jars
        run: ls -la build/libs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*-ot.jar
            build/libs/!(*-dev.jar|*-sources.jar|*-shadow.jar)
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}